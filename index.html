<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autonom Offensiv</title>

    <style>

        /* =========================
           GRUND
        ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,0.035),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(255,255,255,0.025),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #111111 0%,
                    #080808 45%,
                    #131313 100%
                );

            color: #eeeeee;

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow-x: hidden;
        }


        /* =========================
           BETONG / BRUS
        ========================= */

        body::before {
            content: "";
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            opacity: 0.13;

            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            z-index: 10;
        }


        /* =========================
           CRT SCANLINES
        ========================= */

        body::after {
            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 5px
                );

            opacity: 0.15;

            z-index: 20;
        }


        /* =========================
           HUVUDINNEHÅLL
        ========================= */

        .home {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

            position: relative;

            z-index: 5;
        }


        /* =========================
           LOGOTYP
        ========================= */

        .logo {

            width: 165px;

            max-width: 45vw;

            height: auto;

            display: block;

            margin-bottom: 28px;

            filter:
                contrast(1.05)
                brightness(0.95);

            animation:
                logo-flicker 6s infinite;
        }


        /* =========================
           TITEL
        ========================= */

        .title {

            margin: 0;

            color: #f2f2f2;

            font-size: clamp(
                28px,
                5vw,
                54px
            );

            font-weight: 700;

            letter-spacing: 6px;

            text-transform: uppercase;

            line-height: 1.1;

            text-shadow:
                0 0 8px rgba(255,255,255,0.08);

            animation:
                title-flicker 8s infinite;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 34px;

            margin-top: 27px;

            flex-wrap: wrap;
        }


        .navigation a {

            position: relative;

            color: #d5d5d5;

            text-decoration: none;

            font-size: 15px;

            letter-spacing: 3px;

            transition:
                color 0.2s ease,
                text-shadow 0.2s ease;
        }


        /* Liten linje under länken */

        .navigation a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 1px;

            background: #ffffff;

            transition:
                width 0.25s ease;
        }


        /* Hover */

        .navigation a:hover {

            color: #ffffff;

            text-shadow:
                2px 0 rgba(255,255,255,0.25),
                -2px 0 rgba(255,255,255,0.12);
        }


        .navigation a:hover::after {

            width: 100%;
        }


        /* =========================
           LITEN SIGNALTEXT
        ========================= */

        .signal {

            position: absolute;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            color: rgba(255,255,255,0.22);

            font-size: 9px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* =========================
           ANIMATIONER
        ========================= */

        @keyframes logo-flicker {

            0%,
            94%,
            100% {
                opacity: 1;
            }

            95% {
                opacity: 0.85;
            }

            96% {
                opacity: 1;
            }

            97% {
                opacity: 0.7;
            }

            98% {
                opacity: 1;
            }
        }


        @keyframes title-flicker {

            0%,
            92%,
            100% {
                opacity: 1;
                transform: translateX(0);
            }

            93% {
                opacity: 0.8;
                transform: translateX(-1px);
            }

            94% {
                opacity: 1;
                transform: translateX(1px);
            }

            95% {
                opacity: 0.9;
                transform: translateX(0);
            }
        }


        /* =========================
           MOBIL
        ========================= */

        @media (max-width: 600px) {

            .logo {
                width: 130px;
                margin-bottom: 22px;
            }

            .title {
                font-size: 27px;
                letter-spacing: 4px;
            }

            .navigation {
                gap: 20px;
                margin-top: 24px;
            }

            .navigation a {
                font-size: 13px;
                letter-spacing: 2px;
            }

            .signal {
                font-size: 8px;
                letter-spacing: 3px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         STARTSIDA
    ========================== -->

    <main class="home">


        <!-- LOGOTYP -->

        <img
            src="logo.png"
            alt="Autonom Offensiv logotyp"
            class="logo"
        >


        <!-- TITEL -->

        <h1 class="title">
            AUTONOM OFFENSIV
        </h1>


        <!-- NAVIGATION -->

        <nav class="navigation">

            <a href="#">
                MANIFEST
            </a>

            <a href="#">
                MEDIA
            </a>

            <a href="#">
                KONTAKT
            </a>

        </nav>


        <!-- LITEN TEXT LÄNGST NER -->

        <div class="signal">
            !SIGNAL!
        </div>


    </main>


</body>
</html>
